<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container min-h-screen overflow-x-hidden">

<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed opacity-80">

            </p>
</header>

<div class="w-10 h-10 rounded-lg bg-secondary/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history_edu</span>
</div>
<div>
<span class="block text-caption text-secondary font-semibold uppercase tracking-wider">Active Thesis</span>
<span class="block font-body-lg font-semibold text-on-surface">Quantum Dynamics</span>
</div>
</div>

<div class="flex items-center gap-sm">
