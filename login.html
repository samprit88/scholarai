    const theme = savedTheme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);

  })();

<style>
:root{
  --auth-bg:#FAF3E8;
  --auth-surface:#fffaf2;
  --auth-surface-strong:#EDE3D4;
  --auth-text:#2D1B4E;
  --auth-muted:#7C6A91;
  --auth-border:#d8cfc2;
  --auth-primary:#7B3FA0;
  --auth-gold:#C4853A;
  --auth-on-dark:#FAF3E8;
  --auth-shadow:0 24px 70px -42px rgba(45,27,78,.5);
}
[data-theme="dark"]{
  color-scheme:dark;
  --auth-bg:#1A1025;
  --auth-surface:#2D1B4E;
  --auth-surface-strong:#3D2A5E;
  --auth-text:#FAF3E8;
  --auth-muted:#E8D9C4;
  --auth-border:#4D3B6E;
  --auth-primary:#7B3FA0;
  --auth-gold:#C4853A;
  --auth-on-dark:#FAF3E8;
  --auth-shadow:0 26px 76px -42px rgba(0,0,0,.78);
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh;
  background:var(--auth-bg);
  color:var(--auth-text);
  font-family:"Plus Jakarta Sans",sans-serif;
  overflow-x:hidden;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1}
.auth-page{
  position:relative;
  min-height:100dvh;
  width:min(100%,430px);
  margin:0 auto;
  padding:40px 24px 28px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.auth-page::before{
  content:"";
  position:absolute;
  top:-170px;
  left:50%;
  width:560px;
  height:560px;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(123,63,160,.18),rgba(123,63,160,0) 68%);
  pointer-events:none;
  z-index:-2;
}
.auth-page::after{
  content:"";
  position:absolute;
  right:-92px;
  top:-76px;
  width:260px;
  height:260px;
  border-radius:999px;
  background:rgba(123,63,160,.1);
  filter:blur(80px);
  pointer-events:none;
  z-index:-2;
}
.auth-header{text-align:center;margin-bottom:28px}
.auth-brand{
  font-family:"Playfair Display",serif;
  font-size:42px;
  line-height:1.08;
  color:var(--auth-text);
  margin-bottom:8px;
}
.auth-subtitle{
  max-width:290px;
  margin:0 auto;
  color:var(--auth-muted);
  font-size:14px;
  line-height:1.6;
}
.auth-hero{
  position:relative;
  flex:1;
  min-height:336px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:34px;
}
.auth-orbit{
  position:absolute;
  inset:50% auto auto 50%;
  width:318px;
  height:318px;
  transform:translate(-50%,-50%);
  border:1px solid color-mix(in srgb,var(--auth-muted) 12%,transparent);
  border-radius:50%;
  pointer-events:none;
}
.auth-orbit.auth-orbit-wide{width:372px;height:372px;opacity:.48}
.auth-orbit.auth-orbit-soft{
  width:236px;
  height:236px;
  border-color:color-mix(in srgb,var(--auth-gold) 13%,transparent);
  background:radial-gradient(circle,rgba(196,133,58,.08),rgba(196,133,58,0) 66%);
}
.auth-visual{
  position:relative;
  width:min(70vw,272px);
  aspect-ratio:1;
  border:1px solid color-mix(in srgb,var(--auth-gold) 28%,transparent);
  border-radius:50%;
  overflow:hidden;
  box-shadow:var(--auth-shadow);
  background:var(--auth-surface);
}
.auth-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:.72;
  filter:grayscale(1);
  transition:filter .7s ease,opacity .7s ease,transform .7s ease;
}
.auth-visual:hover img{filter:grayscale(0);opacity:.86;transform:scale(1.03)}
.auth-visual-shade{position:absolute;inset:0;background:linear-gradient(to top,var(--auth-bg),transparent 52%,transparent)}
.auth-spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--auth-gold);
  box-shadow:0 0 22px color-mix(in srgb,var(--auth-gold) 70%,transparent);
  opacity:.72;
  pointer-events:none;
}
.auth-spark-one{top:72px;right:52px}
.auth-spark-two{left:54px;bottom:76px;width:6px;height:6px;opacity:.48}
.auth-actions{display:grid;gap:10px}
.auth-google{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:12px;
  background:var(--auth-text);
  color:var(--auth-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font:700 15px/1 "Plus Jakarta Sans",sans-serif;
  cursor:pointer;
  box-shadow:var(--auth-shadow);
  transition:transform .16s ease,filter .16s ease,background .2s ease,color .2s ease;
}
.auth-google:hover{filter:brightness(1.06)}
.auth-google:active{transform:scale(.985)}
.auth-google:disabled{cursor:not-allowed;opacity:.68}
.auth-google svg{width:20px;height:20px;flex:0 0 auto}
.auth-status{min-height:18px;color:var(--auth-muted);font-size:12px;line-height:1.4;text-align:center}
.auth-footer{padding-top:12px;text-align:center}
.auth-footer p{max-width:310px;margin:0 auto;color:color-mix(in srgb,var(--auth-muted) 66%,transparent);font-size:11px;line-height:1.6}
.auth-footer a{color:var(--auth-gold);text-underline-offset:4px}
.auth-install{display:none;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--auth-border);border-radius:14px;background:color-mix(in srgb,var(--auth-surface) 82%,transparent);box-shadow:var(--auth-shadow)}
.auth-install-copy{min-width:0}
.auth-install-copy strong{display:block;color:var(--auth-text);font-size:13px;line-height:1.25}
.auth-install-copy span{display:block;margin-top:3px;color:var(--auth-muted);font-size:11px;line-height:1.35}
.auth-install button{flex:0 0 auto;min-height:34px;padding:8px 12px;border:0;border-radius:999px;background:var(--auth-gold);color:#1A1025;font:700 12px/1 "Plus Jakarta Sans",sans-serif;cursor:pointer}
.auth-dots{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:26px}
.auth-dots span{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--auth-muted) 24%,transparent)}
.auth-dots span:first-child{background:var(--auth-gold)}
.auth-bg-ring{position:fixed;border:1px solid color-mix(in srgb,var(--auth-gold) 8%,transparent);border-radius:50%;pointer-events:none;opacity:.7}
.auth-bg-ring-one{top:24%;left:-58px;width:116px;height:116px;transform:rotate(45deg)}
.auth-bg-ring-two{right:-88px;bottom:20%;width:176px;height:176px}
@media(max-width:430px){
  .auth-page{padding:34px 20px 24px}
  .auth-header{margin-bottom:20px}
  .auth-brand{font-size:40px}
  .auth-hero{min-height:318px;margin-bottom:28px}
  .auth-spark-one{right:42px}
  .auth-spark-two{left:42px}
}
@media(max-width:360px){
  .auth-page{padding-inline:16px}
  .auth-brand{font-size:36px}
  .auth-subtitle{font-size:13px}
  .auth-hero{min-height:292px}
  .auth-visual{width:min(72vw,248px)}
  .auth-orbit{width:294px;height:294px}
  .auth-orbit.auth-orbit-wide{width:340px;height:340px}
  .auth-google{font-size:14px}
}
</style>
</head>
<body>
  <main class="auth-page" aria-labelledby="auth-title">
    <header class="auth-header">
      <h1 id="auth-title" class="auth-brand">ScholarAI</h1>
      <p class="auth-subtitle">Elevating academic research through the precision of artificial intelligence.</p>
    </header>

    <section class="auth-hero" aria-label="ScholarAI academic workspace preview">
      <div class="auth-orbit"></div>
      <div class="auth-orbit auth-orbit-wide"></div>
      <div class="auth-orbit auth-orbit-soft"></div>
      <div class="auth-visual">
        <img alt="Academic research desk with an open book and warm scholarly light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBc8TTaR1k5nUpPGW9iw3WCq0UiWSewZB6Z__ABF-Y1LGFjhiyPBm911zaDw4OacIhmoMKR-haVxQqXI1IZdZqyZy72OHlWLiD18-G3CdAVAPzfcP9yuYRM3AAo6yNekq-AkVv8ZpSn3vMttmyST_1F3wS_DO2UVB84zBCy9NY35672rPpwvYPajoqjUfmSc5C02bw_mwpAp2AjKoZLyo3UsuAhgBhjC0U7hLf2nf4xwp2woYeK6bQGsYFunPwhhMsHcuFw6Af0QvJd">
        <div class="auth-visual-shade"></div>
      </div>
      <span class="auth-spark auth-spark-one" aria-hidden="true"></span>
      <span class="auth-spark auth-spark-two" aria-hidden="true"></span>
    </section>

    <section class="auth-actions" aria-label="Authentication options">
      <button id="google-signin-btn" class="auth-google" type="button" onclick="continueWithGoogle()">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
        </svg>
        <span>Continue with Google</span>
      </button>
      <div id="login-status" class="auth-status" aria-live="polite"></div>
      <footer class="auth-footer">
        <p>By continuing, you agree to ScholarAI's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
      </footer>
      <div id="auth-install-banner" class="auth-install">
        <div class="auth-install-copy"><strong>Install ScholarAI</strong><span>Add it to your home screen for faster access.</span></div>
        <button id="auth-install-btn" type="button">Install</button>
      </div>
    </section>

    <div class="auth-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
  <div class="auth-bg-ring auth-bg-ring-one" aria-hidden="true"></div>
  <div class="auth-bg-ring auth-bg-ring-two" aria-hidden="true"></div>

  <script>
    const loginStatus = document.getElementById('login-status');
    const googleButton = document.getElementById('google-signin-btn');
    let authDeferredPrompt = null;

    function isStandalonePWA() {
      return window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone;
    }

    function isIOSInstallCandidate() {
      const ua = window.navigator.userAgent || '';
      const isiOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return isiOS && !window.navigator.standalone;
    }

    function showAuthInstallBanner() {
      const banner = document.getElementById('auth-install-banner');
      if (!banner || (!authDeferredPrompt && !isIOSInstallCandidate()) || isStandalonePWA()) return;
      banner.style.display = 'flex';
    }

    function hideAuthInstallBanner() {
      const banner = document.getElementById('auth-install-banner');
      if (banner) banner.style.display = 'none';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      authDeferredPrompt = event;
      showAuthInstallBanner();
    });

    window.addEventListener('appinstalled', () => {
      authDeferredPrompt = null;
      hideAuthInstallBanner();
      window.ScholarAnalytics?.capture('pwa_installed');
    });

    document.getElementById('auth-install-btn')?.addEventListener('click', async () => {
      if (!authDeferredPrompt) {
        loginStatus.textContent = 'On iPhone or iPad, use Share, then Add to Home Screen.';
        return;
      }
      hideAuthInstallBanner();
      authDeferredPrompt.prompt();
      await authDeferredPrompt.userChoice.catch(() => {});
      authDeferredPrompt = null;
    });

    if (isIOSInstallCandidate()) {
      window.addEventListener('load', () => setTimeout(showAuthInstallBanner, 600));
    }

    ScholarFirebase.auth.onAuthStateChanged(user => {
      if (user) window.location.replace('index.html');
    });

    async function continueWithGoogle() {
      loginStatus.textContent = 'Opening Google sign-in...';
      googleButton.disabled = true;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await ScholarFirebase.auth.signInWithPopup(provider);
        const user = result.user || ScholarFirebase.auth.currentUser;
        window.ScholarAnalytics?.identifyFirebaseUser(user);
        window.ScholarAnalytics?.capture('user_logged_in');
        window.location.replace('index.html');
      } catch (error) {
        loginStatus.textContent = error.message || 'Google sign-in failed.';
        googleButton.disabled = false;
      }
    }
  </script>
</body>
